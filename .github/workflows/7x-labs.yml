name: 7X Labs validation
on:
  push:
    branches: [codex/7x-labs-validation]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: yes | /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - run: chmod +x gradlew
      - run: ./gradlew :core:testDebugUnitTest :app:assembleDebug :wear:assembleDebug --stacktrace

