name: 7X Labs validation
on:
  push:
    branches: [codex/7x-labs-validation]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: yes | sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - run: chmod +x gradlew
      - run: ./gradlew :core:testDebugUnitTest :app:assembleDebug :wear:assembleDebug --stacktrace

